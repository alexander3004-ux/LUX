<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas | Reservas Granada</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { padding-top: 80px; }
        header { background: var(--bg-panel); box-shadow: var(--shadow-light); }
        .logo, .nav-links a { color: var(--text-main); }
        .logo i { color: var(--primary-color); }

        .lookup-container {
            max-width: 600px;
            margin: 4rem auto;
            background: var(--bg-panel);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: var(--shadow-light);
            text-align: center;
        }
        .lookup-container h2 {
            color: var(--secondary-color);
            margin-bottom: 1rem;
        }
        .lookup-container p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .result-card {
            display: none;
            margin-top: 2rem;
            text-align: left;
            padding: 1.5rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-light);
        }
        .result-card.active { display: block; }
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-Confirmada { background: #dcfce7; color: #166534; }
        .status-Cancelada { background: #fee2e2; color: #991b1b; }
        .status-Pendiente { background: #fef9c3; color: #854d0e; }
    </style>
</head>
<body>
    <header id="main-header" class="scrolled">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-bell-concierge"></i> Reservas<span>Granada</span>
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="restaurantes.html">Restaurantes</a></li>
                <li><a href="mis-reservas.html" class="active">Mis Reservas</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <div class="lookup-container">
            <h2>Consulta tu Reserva</h2>
            <p>Ingresa tu código de reserva (Ej. ABC-123) para ver los detalles.</p>

            <form id="lookupForm">
                <div class="form-group">
                    <input type="text" id="lookupCode" required placeholder="Código de reserva" style="text-transform: uppercase; text-align: center; font-size: 1.2rem; letter-spacing: 2px;">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%;">Buscar Reserva</button>
            </form>

            <div id="resultCard" class="result-card">
                <!-- Data injected via JS -->
            </div>

            <div id="errorMsg" style="color: #ef4444; margin-top: 1rem; display: none;">
                No se encontró ninguna reserva con este código.
            </div>
        </div>
    </main>

    <script src="js/data.js"></script>
    <script>
        document.getElementById('lookupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const code = document.getElementById('lookupCode').value.trim().toUpperCase();
            const reservations = getReservations();
            const res = reservations.find(r => r.reservationCode === code);

            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');

            if (res) {
                errorMsg.style.display = 'none';
                resultCard.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
                        <h3 style="color: var(--secondary-color); margin: 0;">${res.restaurantName}</h3>
                        <span class="status-badge status-${res.status}">${res.status}</span>
                    </div>
                    <p><strong>Fecha:</strong> ${res.date}</p>
                    <p><strong>Hora:</strong> ${res.time}</p>
                    <p><strong>Personas:</strong> ${res.partySize}</p>
                    <p><strong>A nombre de:</strong> ${res.customerName}</p>
                    <p><strong>Código:</strong> ${res.reservationCode}</p>
                `;
                resultCard.classList.add('active');
            } else {
                resultCard.classList.remove('active');
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>
