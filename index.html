<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granada Gastronómica | Reservas Inteligentes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- HEADER -->
    <header id="main-header">
        <nav class="navbar">
            <div class="logo">
                <i class="fa-solid fa-utensils"></i> GRX<span>NADA</span>
            </div>
            <ul class="nav-links">
                <li><a href="#experiencias" class="active">Experiencias</a></li>
                <li><a href="#mixologia">Mixología</a></li>
                <li><a href="#mis-reservas">Mis Reservas</a></li>
            </ul>
        </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero" id="inicio">
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <h1>Sabor. Elegancia. <span>Granada.</span></h1>
            <p>Descubre la alta cocina y coctelería en la joya colonial de Nicaragua. Vive experiencias gastronómicas de lujo con reservas en tiempo real.</p>
            <button class="btn-primary" onclick="scrollToRestaurants()">Explorar Restaurantes</button>
        </div>
    </section>

    <!-- MAIN CONTENT -->
    <main class="container">
        <!-- FILTERS -->
        <section class="filters" id="filters">
            <div class="search-bar">
                <i class="fa-solid fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar restaurantes, cócteles, ambientes...">
            </div>
            <div class="filter-options">
                <select id="cuisineFilter">
                    <option value="all">Tipo de Cocina</option>
                    <option value="local">Nicaragüense Contemporánea</option>
                    <option value="international">Fusión Internacional</option>
                    <option value="mediterranean">Mediterránea</option>
                    <option value="asian">Asiática</option>
                </select>
                <select id="serviceFilter">
                    <option value="all">Servicios / Ambiente</option>
                    <option value="terrace">Terraza Colonial</option>
                    <option value="ac">Salón Climatizado</option>
                    <option value="live_music">Música en Vivo</option>
                    <option value="rooftop">Rooftop View</option>
                </select>
            </div>
        </section>

        <!-- RESTAURANTS GRID -->
        <section class="restaurants-grid" id="restaurantsContainer">
            <!-- Restaurant cards will be dynamically injected here by JS -->
        </section>
    </main>

    <!-- RESERVATION MODAL -->
    <div id="reservationModal" class="modal">
        <div class="modal-content glass-panel">
            <span class="close-modal">&times;</span>
            <div class="modal-header">
                <h2 id="modalRestaurantName">Reservar Mesa</h2>
                <p>Configura tu experiencia</p>
            </div>

            <form id="reservationForm">
                <div class="form-group">
                    <label for="resDate"><i class="fa-regular fa-calendar"></i> Fecha y Hora</label>
                    <input type="datetime-local" id="resDate" required>
                </div>

                <div class="form-group">
                    <label for="resGuests"><i class="fa-solid fa-users"></i> Número de Personas</label>
                    <input type="number" id="resGuests" min="1" max="20" value="2" required>
                </div>

                <div class="form-group">
                    <label for="resZone"><i class="fa-solid fa-map-location-dot"></i> Zona del Restaurante</label>
                    <select id="resZone" required>
                        <option value="" disabled selected>Selecciona una zona</option>
                        <option value="terraza">Terraza Colonial</option>
                        <option value="salon">Salón con Aire Acondicionado</option>
                        <option value="barra">Barra de Mixología</option>
                    </select>
                </div>

                <div class="reservation-summary">
                    <h3>Detalles Adicionales</h3>
                    <textarea id="resNotes" placeholder="Alergias, celebraciones, peticiones especiales..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Confirmar Reserva</button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast" class="toast">
        <i class="fas fa-info-circle"></i>
        <span id="toastMessage">Mensaje</span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
